[project]
name = "nonebot-plugin-ban-sticker"
version = "0.2.0"
description = "If you plan to ban sticker in your group chat"
license = "MIT"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "nonebot-adapter-onebot>=2.4.6",
    "nonebot2>=2.4.2",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: AsyncIO",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.urls]
Homepage = "https://github.com/MovFish/nonebot-plugin-ban-sticker"
Repository = "https://github.com/MovFish/nonebot-plugin-ban-sticker"
Issues = "https://github.com/MovFish/nonebot-plugin-ban-sticker/issues"
